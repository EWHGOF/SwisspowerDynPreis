name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The two Home Assistant versions are pinned on purpose: one is the oldest
# release the integration claims to support (hacs.json), the other a current
# one, so a deprecation surfaces here rather than in an issue report. Bump the
# second pair when a newer release appears.
#
# The HACS validator (hacs/action) is deliberately not here yet. It also checks
# things no commit can set: the repository needs a description and topics on
# GitHub, and the domain has to be added to home-assistant/brands. Once those
# are done, add:
#
#   hacs:
#     runs-on: ubuntu-latest
#     steps:
#       - uses: actions/checkout@v4
#       - uses: hacs/action@main
#         with:
#           category: integration
jobs:
  pytest:
    name: pytest (HA ${{ matrix.homeassistant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - homeassistant: "2024.3.3"
            phacc: "0.13.109"
            python: "3.11"
          - homeassistant: "2026.2.3"
            phacc: "0.13.316"
            python: "3.13"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "pytest-homeassistant-custom-component==${{ matrix.phacc }}" tzdata

      - name: Verify the pinned Home Assistant version
        run: |
          python -c "from homeassistant.const import __version__ as v; expected='${{ matrix.homeassistant }}'; assert v == expected, f'got {v}, expected {expected}'; print('Home Assistant', v)"

      - name: Run tests
        run: python -m pytest tests/ -q

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
